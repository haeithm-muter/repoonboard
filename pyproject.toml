[project]
name = "repoonboard"
# Single source of truth: src/repoonboard/__init__.py. Keeping the number in
# two places invites shipping a package that misreports its own version.
dynamic = ["version"]
description ="Generates CodeTour learning paths for a repository, ordered by its real dependency graph rather than by a language model's opinion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codetour", "onboarding", "static-analysis", "dependency-graph", "tree-sitter"]
authors = [{ name = "haeithm-muter" }]

# Alpha, deliberately. Five milestones are complete and 255 tests pass, but the
# project's central claim -- that computed ordering beats a model's opinion --
# has never been measured, and station selection has a known defect recorded in
# NOTES.md. "Beta" would overstate what has been verified.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.2",
    # networkx.pagerank delegates to its scipy implementation, which imports
    # numpy and scipy directly. networkx declares both only under its optional
    # "default" extra, so they must be requested explicitly or scoring raises
    # ModuleNotFoundError on a clean install.
    "numpy>=1.25",
    "scipy>=1.11.2",
    "pydantic>=2.6",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/haeithm-muter/repoonboard"
Repository = "https://github.com/haeithm-muter/repoonboard"
Issues = "https://github.com/haeithm-muter/repoonboard/issues"

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
repoonboard = "repoonboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/repoonboard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/repoonboard"]

[tool.hatch.build.targets.sdist]
# Tests and the evaluation harness ship deliberately: a downstream packager
# should be able to run the suite, and the numbers in the README should be
# reproducible from the source distribution alone.
#
# These do not ship. CLAUDE.md describes itself as local configuration rather
# than published content, and .claude/ holds local tool settings; putting
# either inside a package uploaded to PyPI would contradict that.
exclude = [
    ".claude",
    "CLAUDE.md",
    ".eval-cache",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# typer's whole API is `def cmd(x: T = typer.Option(...))`. B008 flags exactly
# that idiom, and the suggested workaround would make every command harder to
# read for no benefit.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Findings recorded under "Findings carried into milestone 3" in NOTES.md.
# They are real and deliberately unfixed: changing station selection needs the
# evaluation harness first. Listing them here rather than leaving `ruff check`
# permanently red means CI can gate on the linter for real, and any *new*
# finding shows up instead of being lost in known noise. Delete an entry once
# the underlying issue is fixed.
"src/repoonboard/stations.py" = ["F401", "SIM222"]
"src/repoonboard/graph.py" = ["F841"]
"src/repoonboard/imports.py" = ["PIE810"]
"src/repoonboard/cli.py" = ["F841"]
"tests/test_imports.py" = ["I001"]
