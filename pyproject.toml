[project]
name = "repoonboard"
version = "0.1.0"
description = "Generates CodeTour learning paths for a repository, ordered by its real dependency graph rather than by a language model's opinion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["codetour", "onboarding", "static-analysis", "dependency-graph", "tree-sitter"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.2",
    # networkx.pagerank delegates to its scipy implementation, which imports
    # numpy and scipy directly. networkx declares both only under its optional
    # "default" extra, so they must be requested explicitly or scoring raises
    # ModuleNotFoundError on a clean install.
    "numpy>=1.25",
    "scipy>=1.11.2",
    "pydantic>=2.6",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
repoonboard = "repoonboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoonboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# typer's whole API is `def cmd(x: T = typer.Option(...))`. B008 flags exactly
# that idiom, and the suggested workaround would make every command harder to
# read for no benefit.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Findings recorded under "Findings carried into milestone 3" in NOTES.md.
# They are real and deliberately unfixed: changing station selection needs the
# evaluation harness first. Listing them here rather than leaving `ruff check`
# permanently red means CI can gate on the linter for real, and any *new*
# finding shows up instead of being lost in known noise. Delete an entry once
# the underlying issue is fixed.
"src/repoonboard/stations.py" = ["F401", "SIM222"]
"src/repoonboard/graph.py" = ["F841"]
"src/repoonboard/imports.py" = ["PIE810"]
"src/repoonboard/cli.py" = ["F841"]
"tests/test_imports.py" = ["I001"]
