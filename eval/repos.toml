# The four evaluation repositories. Pin these on day one, not at the end:
# every claim in the README is measured against them.
#
# Criteria: 50-500 source files, actively maintained, architecturally
# different from each other, two Python and two TypeScript.
#
# Ground truth for each repo is the union of three sources independent of
# the author's judgement:
#   1. files referenced anywhere in the repository's prose, as a path or as a
#      Python dotted module name
#   2. the ten most-committed files
#   3. files referenced from "good first issue" threads
#
# Source 1 was originally "files named in CONTRIBUTING.md". That was measured
# and yielded nothing on all four repositories: contributing guides describe
# process, not architecture. CODEOWNERS and ARCHITECTURE.md were probed as
# replacements and exist in none of the four. See eval/source_probe.json.
#
# A source naming more than 25% of a repository is recorded but excluded from
# the union: scrapy's documentation references 50.8% of its own modules, which
# is correct and useless, since six files chosen at random would score about
# as well against it.
#
# ---------------------------------------------------------------------------
# Every number below was measured, not estimated. `source_files` and
# `discovered_files` come from running this project's own discovery rules over
# the pinned tree; `discovered_files` includes tests, and is recorded because
# it is the number checked against MAX_FILES (1500). `good_first_issue_count`
# comes from the GitHub search API. Re-measure with eval/survey.py if you
# change a pin.
#
# One caveat is recorded rather than hidden: hono carries no `good first issue`
# label at all, so its ground truth is the union of two sources, not three.
# That label turned out to be absent from most repositories surveyed
# (apollo-client, ink, seaborn and hono all had zero), which is a limitation of
# the three-source method itself, not of these repositories. The harness
# records which sources contributed per repository and the results table
# reports it.
# ---------------------------------------------------------------------------

